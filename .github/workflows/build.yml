name: build.yml
on:
  push:
    tags:
      - 'v*'
jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
            make-args: ARCHFLAGS="-arch arm64 -arch x86_64"
            #INCLUDE WINDOWS LATER

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: build
        run: make release ${{ matrix.make-args }}
      - name: test
        run:  make test ${{ matrix.make-args }}
      - name: rename binary
        shell: bash
        run: |
          ext=""; [ -f main.exe ] && ext=.exe
          bin=out-${{ runner.os }}$ext
          mv main$ext "$bin"
          echo "BIN=$bin" >> "$GITHUB_ENV"
      - name: upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BIN }}
          path: ${{ env.BIN }}

  release:
    name: Release to Github releases
    runs-on: ubuntu-latest
    needs: build
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
    steps:
      - name: pull binaries
        uses: actions/download-artifact@v8
        with:
          merge-multiple: 'true'
      - name: create release
        run: gh release create "${{ github.ref_name }}" out-* --generate-notes --repo "${{ github.repository }}"