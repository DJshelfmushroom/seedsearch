name: build
on:
  push:
    tags:
      - 'v*'
jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: macos-universal
            make-args: ARCHFLAGS="-arch arm64 -arch x86_64"
          #INCLUDE WINDOWS LATER
          # - os: windows-latest
          #   platform: windows-x86_64
          #   make-args: CC=gcc

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: build
        run: make release ${{ matrix.make-args }}
      - name: test
        run:  make test ${{ matrix.make-args }}
      - name: package
        shell: bash
        run: |
          ext=""; [ -f main.exe ] && ext=.exe
          mkdir dist
          mv main$ext dist/seedsearch$ext
          # windows could use a .zip instead
          pkg=seedsearch-${{ github.ref_name }}-${{ matrix.platform }}.tar.gz
          tar czf "$pkg" -C dist "seedsearch$ext"
          echo "PKG=$pkg" >> "$GITHUB_ENV"
      - name: upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PKG }}
          path: ${{ env.PKG }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: pull packages
        uses: actions/download-artifact@v8
        with:
          merge-multiple: 'true'
      - name: write release notes
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DISABLE_AUTOUPDATER: 1
        run: |
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || { echo "no token, skipping"; exit 0; }
          prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          empty=$(git hash-object -t tree /dev/null)
          {
            echo "# Commits"
            git log --no-merges --format='- %s%n%w(0,2,2)%b' ${prev:+$prev..}"$TAG"
            echo; echo "# Files changed"
            git diff --stat "${prev:-$empty}" "$TAG"
          } > context.txt
          curl -fsSL https://claude.ai/install.sh | bash
          ~/.local/bin/claude -p --model opus --tools "" --max-turns 1 --no-session-persistence \
            "$(cat .github/release-notes-prompt.md)" < context.txt > whats-new.tmp
          mv whats-new.tmp whats-new.md
      - name: create release
        run: |
          gh release create "$TAG" seedsearch-*.tar.gz \
            --title "$TAG" \
            --notes "$(sed "s/{{TAG}}/$TAG/g" .github/release-header.md; echo; cat whats-new.md 2>/dev/null)" \
            --generate-notes \
            --prerelease=${{ contains(github.ref_name, '-pre') }} \
            --repo "${{ github.repository }}"
