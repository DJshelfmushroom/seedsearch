name: Build
on:
  workflow_call:
    inputs:
      version:
        type: string
        default: unknown
jobs:
  matrix:
    uses: ./.github/workflows/setup-matrix.yml
  build:
    name: Build (${{ matrix.platform }})
    needs: matrix
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell || 'bash' }}
    strategy:
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          install: make zip mingw-w64-ucrt-x86_64-gcc
      - name: build
        run: make release ${{ matrix.make-args }}
      - name: smoke test options
        run: |
          set -e
          for args in "--seed=0 --end=3000" "--seed 0 --end 3000" "-s 0 -e 3000"; do
            out=$(./seedsearch $args village:64)
            grep -q "^HIT 35 " <<<"$out"
          done
          out=$(./seedsearch village:64 -s 0 -e 3000)
          grep -q "^HIT 35 " <<<"$out"
          ./seedsearch --help
          if ./seedsearch --bogus village; then echo "--bogus should fail"; exit 1; fi
      - name: package
        run: |
          if [ -f seedsearch.exe ]; then
            mkdir dist && mv seedsearch.exe dist/seedsearch.exe
            pkg=seedsearch-${{ inputs.version }}-${{ matrix.platform }}.zip
            (cd dist && zip "../$pkg" seedsearch.exe)
          else
            mkdir dist && mv seedsearch dist/seedsearch
            pkg=seedsearch-${{ inputs.version }}-${{ matrix.platform }}.tar.gz
            tar czf "$pkg" -C dist seedsearch
          fi
          echo "PKG=$pkg" >> "$GITHUB_ENV"
      - name: upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PKG }}
          path: ${{ env.PKG }}
